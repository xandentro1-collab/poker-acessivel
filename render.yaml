# Configuração de deploy para o Render (https://render.com).
# Blueprint no plano GRATUITO, com banco PostgreSQL permanente.

databases:
  - name: poker-db
    plan: free
    # OBS.: o PostgreSQL gratuito do Render é ótimo para testes. Ele tem limites
    # e pode expirar após alguns meses no plano free — para produção de verdade,
    # migre para um plano pago quando o beta amadurecer.

services:
  - type: web
    name: poker-acessivel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k gevent -w 1 wsgi:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL              # conexão com o PostgreSQL acima (permanente)
        fromDatabase:
          name: poker-db
          property: connectionString
      - key: POKER_SECRET
        generateValue: true            # chave secreta segura gerada automaticamente
      - key: POKER_EXIGIR_CONVITE
        value: "1"                     # beta fechado: cadastro exige convite
      - key: POKER_ADMIN_EMAILS
        value: "xandentro1@gmail.com"  # este e-mail entra como admin, sem convite
      - key: PYTHON_VERSION
        value: "3.12.4"

# Agora os dados (contas, saldos, convites) ficam no PostgreSQL e NÃO se perdem
# quando o serviço hiberna ou é reimplantado.
#
# Para ligar o e-mail de boas-vindas, adicione depois (na aba Environment do
# serviço, no painel do Render) as variáveis SMTP_HOST, SMTP_PORT, SMTP_USER,
# SMTP_PASS e SMTP_FROM. Veja o DEPLOY.md.
